<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SMK Gallery</title>
    <link rel="stylesheet" href="./gallery.css">
    <!-- TypeScript: serve with `npm run gallery`, not live-server. -->
    <script type="module" src="./gallery.ts"></script>
</head>
<body data-gallery="starting">
    <header class="g-bar">
        <strong>SMK Gallery</strong>
        <span class="g-muted">One component, no map</span>
        <span class="g-spacer"></span>
        <label>Build
            <select id="g-build">
                <option value="v2">v2</option>
                <option value="both">v2 + 1.0</option>
                <option value="1.0">1.0 only</option>
            </select>
        </label>
        <label data-when="both">Layout
            <select id="g-layout">
                <option value="side">Side by side</option>
                <option value="overlay">Overlay</option>
            </select>
        </label>
        <label data-when="overlay">1.0 <input type="range" id="g-fade" min="0" max="100" value="50" aria-label="SMK 1.0 opacity"></label>
        <label>Theme <select id="g-theme"></select></label>
        <label><input type="checkbox" id="g-mobile"> Mobile</label>
    </header>

    <nav id="g-nav" aria-label="Components"></nav>

    <main class="g-main">
        <section class="g-view">
            <div class="g-title">
                <h1 id="g-name"></h1>
                <code id="g-source"></code>
            </div>
            <p class="g-muted"><span id="g-kind"></span> <span id="g-note"></span></p>
            <p id="g-mobile-note" class="g-muted" hidden>SMK's orientation media queries read the window, not this frame.</p>
            <div id="g-panes" class="g-panes"></div>
            <section id="g-diff" class="g-diff" aria-live="polite" hidden></section>
        </section>

        <aside class="g-inspector">
            <section>
                <div class="g-section-head">
                    <h2>Props</h2>
                    <button id="g-apply" type="button">Apply</button>
                    <button id="g-reset" type="button">Reset</button>
                </div>
                <textarea id="g-props" spellcheck="false" aria-label="Props as JSON"></textarea>
                <p id="g-json-error" class="g-error" role="alert"></p>
            </section>
            <section>
                <div class="g-section-head">
                    <h2>Events</h2>
                    <button id="g-clear" type="button">Clear</button>
                </div>
                <ol id="g-log" class="g-log" aria-live="polite"></ol>
            </section>
        </aside>
    </main>
</body>
</html>
